name: Publish Spring Boot Starter

on:
  push:
    branches:
      - main
    paths:
      - 'integrations/spring-boot/**'
      - '.github/workflows/publish-spring-boot.yml'
    tags:
      - 'spring-boot-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build, test, sign without publishing)'
        required: false
        type: boolean
        default: false
      version:
        description: 'Explicit release version (e.g. 0.1.0). Leave blank to use pom.xml'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test across Spring Boot Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ['spring-boot-2', 'spring-boot-3', 'spring-boot-4']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Spring Boot Tests (${{ matrix.profile }})
        working-directory: integrations/spring-boot
        run: mvn clean test -P${{ matrix.profile }}

  publish:
    name: Publish to Maven Repository
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat << 'EOF' > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>ossrh</id>
                <username>${env.OSSRH_USERNAME}</username>
                <password>${env.OSSRH_PASSWORD}</password>
              </server>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Set Release Version (if requested)
        if: ${{ inputs.version != '' }}
        working-directory: integrations/spring-boot
        run: |
          mvn versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Dry Run Build & Verify
        if: ${{ inputs.dry_run == true }}
        working-directory: integrations/spring-boot
        run: |
          echo "Executing Dry Run..."
          mvn clean verify -DskipTests

      - name: Publish to Maven Central (OSSRH)
        if: ${{ inputs.dry_run != true }}
        working-directory: integrations/spring-boot
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$OSSRH_USERNAME" ] && [ -n "$OSSRH_PASSWORD" ]; then
            echo "Publishing to Maven Central (Sonatype OSSRH)..."
            mvn clean deploy -Prelease -DskipTests
          else
            echo "Skipping Maven Central deployment: OSSRH_USERNAME / OSSRH_PASSWORD secrets are not configured."
          fi

      - name: Publish to GitHub Packages (Maven Registry)
        if: ${{ inputs.dry_run != true }}
        working-directory: integrations/spring-boot
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing to GitHub Packages Maven Registry..."
          mvn clean deploy -DskipTests \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
